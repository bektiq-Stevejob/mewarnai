<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7B96"/>
      <stop offset="50%" stop-color="#FF5E7E"/>
      <stop offset="100%" stop-color="#FF923C"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect x="20" y="20" width="472" height="472" rx="110" fill="url(#bgGrad)"/>

  <!-- Inner cheerful palette graphic -->
  <g filter="url(#dropShadow)" transform="translate(6, 6)">
    <!-- Palette Board -->
    <path d="M 250,110 C 160,110 100,170 100,260 C 100,350 160,400 240,400 C 270,400 300,380 320,380 C 350,380 380,410 400,380 C 430,340 400,280 400,240 C 400,160 340,110 250,110 Z" fill="#FFFFFF" stroke="#FFE3B3" stroke-width="8"/>

    <!-- Thumb hole -->
    <ellipse cx="340" cy="310" rx="22" ry="30" fill="#FF5E7E" opacity="0.3"/>

    <!-- Paint Blobs -->
    <circle cx="180" cy="180" r="26" fill="#FF3B30"/>
    <circle cx="250" cy="165" r="26" fill="#FFD60A"/>
    <circle cx="320" cy="190" r="26" fill="#34C759"/>
    <circle cx="160" cy="255" r="26" fill="#007AFF"/>
    <circle cx="190" cy="330" r="26" fill="#AF52DE"/>
    
    <!-- Paintbrush -->
    <g transform="rotate(35 250 250)">
      <rect x="238" y="70" width="24" height="230" rx="12" fill="#8B5A2B"/>
      <rect x="234" y="150" width="32" height="30" rx="4" fill="#E5E7EB"/>
      <path d="M 234,180 C 234,220 266,220 266,180 Z" fill="#FFD60A"/>
    </g>
  </g>

  <!-- Cute Sparkles -->
  <polygon points="400,80 410,105 435,105 415,120 422,145 400,130 378,145 385,120 365,105 390,105" fill="#FFF275"/>
  <polygon points="90,380 97,398 116,398 101,410 106,428 90,417 74,428 79,410 64,398 83,398" fill="#FFF275"/>
</svg>
